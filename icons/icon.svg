<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- MingaMax: cuatro manos tirando de un billete. Fondo a sangre para ícono "maskable"; el dibujo queda dentro del 80 % central. -->
  <defs>
    <g id="hand">
      <!-- Mano en coordenadas locales: el brazo viene desde -x y los dedos agarran en +x -->
      <rect x="-190" y="-34" width="160" height="68" fill="var(--sleeve)"/>
      <rect x="-46" y="-36" width="18" height="72" rx="6" fill="#ffffff" opacity="0.35"/>
      <rect x="-32" y="-33" width="62" height="66" rx="26" fill="var(--skin)"/>
      <rect x="12" y="-31" width="30" height="15" rx="7.5" fill="var(--skin)" stroke="var(--shade)" stroke-width="2.5"/>
      <rect x="15" y="-15" width="31" height="15" rx="7.5" fill="var(--skin)" stroke="var(--shade)" stroke-width="2.5"/>
      <rect x="14" y="1" width="30" height="15" rx="7.5" fill="var(--skin)" stroke="var(--shade)" stroke-width="2.5"/>
      <rect x="10" y="17" width="27" height="14" rx="7" fill="var(--skin)" stroke="var(--shade)" stroke-width="2.5"/>
      <ellipse cx="2" cy="-30" rx="20" ry="10" transform="rotate(-12 2 -30)" fill="var(--skin)" stroke="var(--shade)" stroke-width="2.5"/>
    </g>
  </defs>

  <rect width="512" height="512" fill="#0e5a5c"/>

  <g transform="translate(256 256) scale(1.12) translate(-256 -256)">
  <!-- Billete -->
  <g>
    <rect x="128" y="178" width="256" height="156" rx="10" fill="#7cc47f"/>
    <rect x="142" y="192" width="228" height="128" rx="6" fill="none" stroke="#2e7d32" stroke-width="5"/>
    <circle cx="256" cy="256" r="40" fill="#a8dba9" stroke="#2e7d32" stroke-width="5"/>
    <text x="256" y="276" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="56" fill="#1b5e20">$</text>
    <circle cx="178" cy="256" r="9" fill="#2e7d32" opacity="0.55"/>
    <circle cx="334" cy="256" r="9" fill="#2e7d32" opacity="0.55"/>
    <!-- Rotura: baja desde el centro del borde superior hasta la mitad del alto del billete -->
    <path d="M240 176 L250 192 L242 205 L252 219 L246 233 L254 246 L256 256 L259 245 L266 231 L260 217 L269 203 L262 190 L272 176 Z" fill="#0e5a5c"/>
    <path d="M240 176 L250 192 L242 205 L252 219 L246 233 L254 246 L256 256" fill="none" stroke="#e3f4e4" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M272 176 L262 190 L269 203 L260 217 L266 231 L259 245 L256 256" fill="none" stroke="#e3f4e4" stroke-width="3.5" stroke-linejoin="round"/>
  </g>

  <!-- Marcas de tensión -->
  <g stroke="#f8fbfa" stroke-width="7" stroke-linecap="round">
    <path d="M232 152 L236 132 M256 150 L256 128 M280 152 L276 132"/>
    <path d="M232 360 L236 380 M256 362 L256 384 M280 360 L276 380"/>
  </g>

  <!-- Cuatro manos, una por esquina, cada una de una persona distinta -->
  <use href="#hand" transform="translate(140 190) rotate(31)" style="--sleeve:#d9531e;--skin:#f2c9a0;--shade:#d9a074"/>
  <use href="#hand" transform="translate(372 190) rotate(149) scale(1 -1)" style="--sleeve:#f0b429;--skin:#8d5a3b;--shade:#6a4027"/>
  <use href="#hand" transform="translate(140 322) rotate(-31) scale(1 -1)" style="--sleeve:#5cc2c0;--skin:#c98b5e;--shade:#a06a40"/>
  <use href="#hand" transform="translate(372 322) rotate(-149)" style="--sleeve:#a78bdb;--skin:#e8b48a;--shade:#c58d60"/>
  </g>
</svg>
